// Ada 23-Oct-2026 "Current Throughput" tiles: a label, a big value with its
// unit, a short sparkline, and the min/max of the window. The sparkline is a
// tiny inline SVG polyline -- a decoration on a number, not a graph, so it gets
// no stat table and no axis.
const TPUT_WINDOW = 60;          // one sample a minute -> the last hour

function sparkSVG(vals, colour) {
  const W = 100, H = 26;
  const nums = vals.map(num).filter(v => v != null);
  if (!nums.length) return '<svg class="spark" viewBox="0 0 100 26" aria-hidden="true"></svg>';
  const max = Math.max(...nums) || 1;
  const step = W / Math.max(1, vals.length - 1);
  const pts = vals.map((v, i) => {
    const n = num(v);
    const y = n == null ? H : H - (n / max) * (H - 4) - 2;
    return (i * step).toFixed(2) + "," + y.toFixed(2);
  }).join(" ");
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none"
    aria-hidden="true"><polyline fill="none" stroke="${colour}" stroke-width="1.2"
    stroke-linejoin="round" points="${pts}"/></svg>`;
}

// Ada 24-Oct-2026 download and upload are ONE tile (Matt): both readings share a
// box, each keeping its label, value, hour-long sparkline and min/max. The box
// is still --box square, so the two halves split it evenly.
function tputBlock(label, unit, vals, colour, fmt) {
  const nums = vals.map(num).filter(v => v != null);
  const lo = nums.length ? Math.min(...nums) : null;
  const hi = nums.length ? Math.max(...nums) : null;
  const last = nums.length ? nums[nums.length - 1] : null;
  return `<div class="tblock">
    <div class="tlabel">${esc(label)}</div>
    <span class="tpval">${fmt(last)}<span class="u">${esc(unit)}</span></span>
    ${sparkSVG(vals, colour)}
    <span class="tpstats"><span>min ${fmt(lo)}</span> <span>max ${fmt(hi)}</span></span>
  </div>`;
}

// Ada 24-Oct-2026 the box's shell is now static HTML (inside the row3 grid, so it
// flows with connection and telemetry); this renders its CONTENT into #tput.
function tputBox(unit, down, up, fmt) {
  return `<div class="btitle">throughput</div>
    <span class="info" tabindex="0" role="button"
          aria-label="About throughput">i<span class="tip" role="tooltip">
      <p><b>Download</b> &mdash; the dish&rsquo;s current download rate from the
        satellite. <b>Upload</b> &mdash; its current upload rate to the
        satellite.</p>
      <p>Each sparkline is the last hour, one sample a minute; min and max are
        over that hour.</p>
      <p>Shown in MB/s, not Mb/s &mdash; 1 MB/s = 8 Mb/s.</p>
    </span></span>
    <div class="tblocks">
      ${tputBlock("download", unit, down, "#a78bfa", fmt)}
      ${tputBlock("upload", unit, up, "#fb7185", fmt)}
    </div>`;
}

function drawHistory(h) {
  const ts = h.ts || [];
  if (!ts.length) {
    $("history").innerHTML = '<h2>history</h2><p class="muted">'
      + esc(h.error || "no history yet") + "</p>";
    return;
  }

  const html = [];
  html.push('<h2>history</h2>');
  html.push('<p class="muted" style="font-size:1.05rem;margin:-.5rem 0 1.4rem">'
    + esc(h.count + " samples over " + Math.round(h.hours) + " h")
    + ' &middot; one row a minute from <code>/srv/van/data/van.db</code></p>');

  // ---- obstruction over time: first panel in the section ---------------------
  // Ada 24-Oct-2026 the sky view section is gone (Matt). The trend and its table
  // are now an ordinary .chart panel -- same markup, same CHART_H, same stat
  // table as the throughput / availability / latency panels below it -- and it
  // sits at the TOP of the history section. The two sky boxes live under the
  // dish section instead.
  {
    const ob = (h.frac_obstruct || []).map((v) => v == null ? null : v * 100);
    const lim = Math.max(2, niceCeil((statsOf(ob) || { max: 0 }).max));
    html.push('<div class="chart">');
    html.push(PANEL("obstruction over time",
                    "fraction of the sky blocked &middot; clear sky is under 2%"));
    html.push('<div class="plot" id="ch-obstruction"></div>');
    html.push(statTable([
      { label: "obstruction", stats: statsOf(ob), fmt: (v) => v.toFixed(2) + " %" },
    ]));
    html.push("</div>");
    PENDING.push(["ch-obstruction",
      (w) => chartOpts(w, [0, lim], "%",
                       (v) => v == null ? "&mdash;" : v.toFixed(0),
                       named(["ob"])),
      [ts, ob]]);
  }

  // ---- throughput: bidirectional --------------------------------------------
  // Up is drawn above zero and down below it, so a quiet link reads as a flat
  // line on the axis and a busy one shows which way the traffic went. The axis
  // is symmetric about zero, which is what makes the two sides comparable.
  // Ada 23-Oct-2026 the axis is in MB/s, not Mb/s -- the moving-data scale the
  // gauges use, so a number reads the same everywhere on the page.
  {
    const down = h.downlink_bps || [], up = h.uplink_bps || [];
    let peak = 1;
    for (let i = 0; i < ts.length; i++) {
      const a = Math.abs(num(down[i]) || 0), b = Math.abs(num(up[i]) || 0);
      if (a > peak) peak = a;
      if (b > peak) peak = b;
    }
    const u = dataRateUnit(peak);
    const lim = niceCeil(peak / u.f);
    const fmt = rateFmt(u);
    html.push('<div class="chart">');
    html.push(PANEL("actual throughput", u.u + " &middot; up above zero, down below"));
    html.push('<div class="plot" id="ch-throughput"></div>');
    html.push(statTable([
      { label: "down", stats: statsOf(down), fmt: fmt },
      { label: "up",   stats: statsOf(up),   fmt: fmt },
    ]));
    html.push("</div>");
    PENDING.push(["ch-throughput",
      (w) => chartOpts(w, [-lim * u.f, lim * u.f], u.u,
                       // Signed on purpose: the down side is negative, so the
                       // labels read -20 / 0 / +20 and each half of the axis is
                       // unambiguous. Taking the absolute value would print the
                       // same number at both ends.
                       rateNum(u),
                       named(["down", "up"])),
      [ts, down.map((v) => v == null ? null : -v), up]]);
  }

  // ---- availability: drop rate ----------------------------------------------
  {
    const drop = (h.ping_drop || []).map((v) => v == null ? null : v * 100);
    const lim = Math.max(1, niceCeil((statsOf(drop) || { max: 0 }).max));
    html.push('<div class="chart">');
    html.push(PANEL("availability", "pop ping drop rate &middot; 0% is clean"));
    html.push('<div class="plot" id="ch-availability"></div>');
    html.push(statTable([
      { label: "drop", stats: statsOf(drop), fmt: (v) => v.toFixed(2) + " %" },
    ]));
    html.push("</div>");
    PENDING.push(["ch-availability",
      (w) => chartOpts(w, [0, lim], "%",
                       (v) => v == null ? "&mdash;" : v.toFixed(0),
                       named(["drop"])),
      [ts, drop]]);
  }

  // ---- latency --------------------------------------------------------------
  {
    const lat = h.ping_latency || [], p90 = h.latency_p90 || [];
    const lim = Math.max(50, niceCeil(Math.max(
      (statsOf(lat) || { max: 0 }).max, (statsOf(p90) || { max: 0 }).max)));
    html.push('<div class="chart">');
    html.push(PANEL("latency", "pop ping RTT &middot; under 40 ms is excellent"));
    html.push('<div class="plot" id="ch-latency"></div>');
    html.push(statTable([
      { label: "rtt", stats: statsOf(lat), fmt: (v) => v.toFixed(1) + " ms" },
      { label: "p90", stats: statsOf(p90), fmt: (v) => v.toFixed(1) + " ms" },
    ]));
    html.push("</div>");
    PENDING.push(["ch-latency",
      (w) => chartOpts(w, [0, lim], "ms",
                       (v) => v == null ? "&mdash;" : v.toFixed(0),
                       named(["lat", "p90"])),
      [ts, lat, p90]]);
  }

  destroyCharts();
  $("history").innerHTML = html.join("");

  // ---- up/down as Current Throughput tiles ---------------------------------
  // Ada 23-Oct-2026 these replace the download/upload half-gauges: the tile
  // shows the current rate, a one-hour sparkline, and the min/max of that hour.
  // The unit comes from the window's own peak, so a quiet hour does not force
  // "0.01 MB/s".
  {
    const down = (h.downlink_bps || []).slice(-TPUT_WINDOW);
    const up = (h.uplink_bps || []).slice(-TPUT_WINDOW);
    let peak = 1;
    for (const v of down.concat(up)) peak = Math.max(peak, Math.abs(num(v) || 0));
    const u = dataRateUnit(peak);
    const fmt = v => v == null ? "&mdash;" : (v / u.f).toFixed(1);
    if ($("tput")) $("tput").innerHTML = tputBox(u.u, down, up, fmt);
  }

  for (const [id, build, data] of PENDING) makeChart(id, build, data);
  PENDING.length = 0;
}

async function loadHistory() {
  const url = HISTORY_URL + "?hours=" + HISTORY_HOURS
    + "&fields=downlink_bps,uplink_bps,ping_drop,ping_latency,frac_obstruct,latency_p90"
    + "&t=" + Date.now();
  try {
    const r = await fetch(url, { cache: "no-store" });
    const h = await r.json();
    if (!r.ok) throw new Error(h.error || ("HTTP " + r.status));
    drawHistory(h);
  } catch (e) {
    $("history").innerHTML = '<h2>history</h2><p class="muted">'
      + esc(String(e).slice(0, 200)) + "</p>";
  }
}

// ---- sky view: the dish's directional obstruction map -----------------------
// Ada 23-Oct-2026 this is a SNAPSHOT, not a time series: it answers "where is
// the sky blocked right now", so the panel is built once and only its image is
// re-fetched. serve-data.py renders the dish's 123x123 grid to a PNG.
// Ada 24-Oct-2026 the whole section is standard square boxes now (Matt): the
// map, the three obstruction stats, and the trend. Each carries its own info
// circle, and the descriptive text that used to sit under each one moved into
// that tip. The boxes flow in a grid rather than sitting in a flex row.
const OBSTRUCTION_URL = "https://harlan.cinnamon-pinecone.ts.net:8891/obstruction.png";

// Ada 24-Oct-2026 the sky boxes are DIRECT children of #skyboxes -- there is no
// .skywrap wrapper any more. #skyboxes is display:contents inside
// .csquares.dishgrid, so the two boxes wrap with the dish's four boxes as one
// group of six (Matt). Keep them direct children: a wrapper would become a grid
// item and the boxes would stop participating in the shared grid.
function renderSky() {
  $("skyboxes").innerHTML = `
    <div class="csquare skybox">
      <div class="btitle">sky map</div>
      <span class="info" tabindex="0" role="button"
            aria-label="About the sky map">i<span class="tip" role="tooltip">
        <p><b>Sky map</b> &mdash; the dish's directional obstruction map. Centre is
          zenith, the edge is the horizon, north at the top.</p>
        <p>Transparent means no data: the dish has not looked that way yet, so it
          is not the same as obstructed.</p>
      </span></span>
      <div class="mapbox">
        <img id="obmap" alt="Starlink dish obstruction map">
        <div class="horizon"></div>
        <span class="compass">N</span>
      </div>
    </div>

    <!-- Ada 24-Oct-2026 the three obstruction stats are ONE list box, like the
         connection box (Matt): title "obstructions", one info circle carrying
         the description of all three. -->
    <div class="csquare olist">
      <div class="btitle">obstructions</div>
      <span class="info" tabindex="0" role="button"
            aria-label="About obstructions">i<span class="tip" role="tooltip">
        <p><b>Fraction obstructed</b> &mdash; how much of the sky the dish sees as
          blocked, as a percentage. Clear sky is under 2%.</p>
        <p><b>Obstruction duration</b> &mdash; the average length of a prolonged
          block, in seconds.</p>
        <p><b>Obstruction interval</b> &mdash; the average time between those
          prolonged blocks, in seconds.</p>
      </span></span>
      <!-- Ada 24-Oct-2026 the labels were too wide for the 300px box: they wrapped
           to two lines and dragged the values down with them (measured 18-50px
           over the row). The page's convention is a SHORT label with the
           description in the (i) tip, so these became Fraction / Duration /
           Interval. -->
      <div class="r"><span class="k">Fraction</span>
        <span class="v" id="obfrac">&mdash;</span></div>
      <div class="r"><span class="k">Duration</span>
        <span class="v" id="obdur">&mdash;</span></div>
      <div class="r"><span class="k">Interval</span>
        <span class="v" id="obint">&mdash;</span></div>
    </div>
  <p class="muted" id="obmap-note" style="display:none"></p>`;

  const img = $("obmap");
  img.addEventListener("load", () => {
    img.style.visibility = "visible";
    const n = $("obmap-note");
    if (n) { n.style.display = "none"; n.textContent = ""; }
  });
  img.addEventListener("error", () => {
    img.style.visibility = "hidden";
    const n = $("obmap-note");
    if (n) {
      n.style.display = "block";
      n.textContent = "sky view unavailable \u2014 is the van tunnel up?";
    }
  });
  updateMap();
}

function updateMap() {
  const img = $("obmap");
  if (img) img.src = OBSTRUCTION_URL + "?t=" + Date.now();
}

const USAGE_PLAN_GB = 100, USAGE_CAP_GB = 50;
// Matt: projection rows (% of 100 GB plan, % to 50 GB cap, remaining GB, band).
// The band colour is a CHILD <span> (not the element's className) so it survives
// load()'s 15s re-render: keep/restore round-trips innerHTML (children), which is
// why the colour lives on the span inside usg-* rather than on usg-* itself.
function renderUsageProjection(totalBytes) {
  const ids = ["usg-pct-used", "usg-pct-cap", "usg-remaining", "usg-status"];
  const usedGB = totalBytes == null || isNaN(totalBytes) ? null : totalBytes / 1e9;
  if (usedGB == null) {
    for (const id of ids) { const e = $(id); if (e) e.innerHTML = "&mdash;"; }
    return;
  }
  const pctPlan = (usedGB / USAGE_PLAN_GB) * 100;
  const pctCap  = (usedGB / USAGE_CAP_GB) * 100;
  const remGB   = USAGE_PLAN_GB - usedGB;
  const cls = usedGB < 30 ? "ok" : (usedGB < 50 ? "warn" : "bad");
  const label = cls === "ok" ? ""
    : cls === "warn" ? "Approaching Data Throttling Limits"
    : "Data throttling limits exceeded";
  const child = (v) => '<span class="' + cls + '">' + esc(v) + '</span>';
  const setv = (id, v) => { const e = $(id); if (e) e.innerHTML = child(v); };
  setv("usg-pct-used", pctPlan.toFixed(1) + "%");
  setv("usg-pct-cap",  pctCap.toFixed(1) + "%");
  setv("usg-remaining", remGB.toFixed(1) + " GB");
  setv("usg-status", label);
}
// Ada 24-Oct-2026 usage over the billing period (Matt). The dish's usage
// counters are rolling, so the total is the sum of the counter's increases --
// serve-data.py does that work and returns the period boundaries too.
const USAGE_DAY = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                   "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const usageDay = (ts) => {
  const d = new Date(ts * 1000);
  return USAGE_DAY[d.getUTCMonth()] + " " + d.getUTCDate();
};
const usageGB = (bytes) => bytes == null ? "&mdash;"
  : (bytes / 1e9).toFixed(2) + " GB";

async function loadUsage() {
  try {
    const r = await fetch(USAGE_URL + "?t=" + Date.now(), { cache: "no-store" });
    const u = await r.json();
    if (!r.ok) throw new Error(u.error || ("HTTP " + r.status));
    $("usg-down").textContent = usageGB(u.down);
    $("usg-up").textContent = usageGB(u.up);
    $("usg-total").textContent = usageGB(u.total);
    $("usg-days").textContent = u.days_left == null ? "&mdash;"
      : u.days_left === 0 ? "ends today"
      : u.days_left + (u.days_left === 1 ? " day" : " days");
    renderUsageProjection(u.total);
  } catch (e) {
    for (const id of ["usg-down", "usg-up", "usg-total",
                      "usg-days"]) {
      const el = $(id);
      if (el) el.textContent = "&mdash;";
    }
    for (const id of ["usg-pct-used", "usg-pct-cap", "usg-remaining", "usg-status"]) {
      const el = $(id);
      if (el) el.innerHTML = "&mdash;";
    }
  }
}

// Ada 24-Oct-2026 the info tips are a TOGGLE (Matt): on an iPhone a tap focuses
// the (i) and nothing ever blurs it, so the tip would not go away. Tap the (i)
// to open it, tap it again -- or anywhere else -- to close it. A tap on the
// tip's own text closes it too, which is what you want when you tap through.
document.addEventListener("click", (e) => {
  const own = (e.target.classList && e.target.classList.contains("info"))
    ? e.target : null;
  document.querySelectorAll(".csquare .info.open").forEach((el) => {
    if (el !== own) el.classList.remove("open");
  });
  if (own) own.classList.toggle("open");
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
  const info = e.target.closest && e.target.closest(".csquare .info");
  if (!info) return;
  e.preventDefault();
  document.querySelectorAll(".csquare .info.open").forEach((el) => {
    if (el !== info) el.classList.remove("open");
  });
  info.classList.toggle("open");
});

load();
renderSky();
loadHistory();
loadUsage();
setInterval(load, 15000);
setInterval(loadHistory, 60000);
setInterval(loadUsage, 60000);
setInterval(updateMap, 60000);

/* TEMP error capture for diagnosis */
window.addEventListener('error', function (e) {
  var d = document.createElement('div');
  d.id = 'page-error';
  d.textContent = 'PAGE-ERROR: ' + (e.message || '') + ' | ' + (e.error && e.error.stack || '');
  document.body.appendChild(d);
});
window.addEventListener('unhandledrejection', function (e) {
  var d = document.createElement('div');
  d.id = 'page-rej';
  d.textContent = 'PAGE-REJ: ' + ((e.reason && e.reason.stack) || e.reason || '');
  document.body.appendChild(d);
});
</script>
